<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }
        
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 36px;
            color: #333;
        }
        
        .error-code {
            font-size: 24px;
            color: #666;
            margin-bottom: 10px;
        }
        
        .error-message {
            font-size: 18px;
            color: #999;
            margin-bottom: 20px;
        }
        
        .button {
            background-color: #4CAF50;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .button:hover {
            background-color: #3e8e41;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Error</h1>
        </div>
        <div class="error-code">
            404 Not Found
        </div>
        <div class="error-message">
            Sorry, the page you are looking for does not exist.
        </div>
        <button class="button" onclick="history.back()">Go Back</button>
    </div>
</body>
</html>
